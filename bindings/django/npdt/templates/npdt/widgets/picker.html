{% load static %}

<link rel="stylesheet" href="{% static 'npdt/css/picker.css' %}">

<input
   type="{{ widget.type }}"
   name="{{ widget.name }}"
   {% if widget.value != None %}
      value="{{ widget.value }}"
   {% endif %}
   {% include "django/forms/widgets/attrs.html" %}
>

<script type="module">
  import { NepaliDatePicker } from '{% static "npdt/js/picker.min.js" %}';

  document.addEventListener('DOMContentLoaded', function() {
    const input = document.querySelector('input[name="{{ widget.name }}"]');
    if (input && !input.dataset.npdInitialized) {
      const options = {{ widget.picker_options|safe }};

      // Apply Django admin theme if requested
      if (options.theme === 'admin') {
        // Detect if we're inside Django admin
        const inAdmin = document.querySelector('#changelist-filter, .admin, #content-main, fieldset.module') !== null
                     || document.body.classList.contains('admin')
                     || window.location.pathname.startsWith('/admin/');

        if (inAdmin) {
          options.theme = 'admin';
        } else {
          // Fallback to auto if not in admin
          options.theme = 'auto';
        }
      }

      try {
        const picker = new NepaliDatePicker(input, options);
        input.dataset.npdInitialized = 'true';

        // Dispatch a custom event so other scripts can interact with the picker
        input.dispatchEvent(new CustomEvent('npd:ready', {
          detail: { picker: picker },
          bubbles: true
        }));
      } catch (error) {
        console.error('Failed to initialize Nepali Date Picker:', error);
      }
    }
  });
</script>
